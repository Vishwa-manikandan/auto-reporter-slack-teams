<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Auto-Reporter</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #555555;
    --border: #d8d8d8;
    --panel: #fafafa;
    --accent: #1d4ed8;
    --accent-fg: #ffffff;
    --error: #b91c1c;
    --error-bg: #fef2f2;
    --warning: #92400e;
    --warning-bg: #fffbeb;
    --success: #166534;
    --success-bg: #f0fdf4;
    --highlight: #fde68a;
    --done: #6b7280;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }
  [data-theme="dark"] {
    --bg: #0f1115;
    --fg: #e8e8e8;
    --muted: #a1a1aa;
    --border: #2b2f36;
    --panel: #161a20;
    --accent: #93b4ff;
    --accent-fg: #0b1220;
    --error: #fca5a5;
    --error-bg: #2a1414;
    --warning: #fcd34d;
    --warning-bg: #2a2210;
    --success: #86efac;
    --success-bg: #12251a;
    --highlight: #4d3d0a;
    --done: #7c8494;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
  * { box-sizing: border-box; }
  html { font-size: 14px; line-height: 1.5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, Cantarell, "Helvetica Neue", sans-serif; }
  body { margin: 0; min-width: 375px; background: var(--bg); color: var(--fg); }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  h2 { font-size: 14px; margin: 0; font-weight: 650; }
  h3 { font-size: 12px; text-transform: none; letter-spacing: 0.02em; color: var(--muted); margin: 0 0 8px; font-weight: 650; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; box-shadow: var(--shadow); }
  button:hover:not(:disabled) { background: var(--panel); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.06); }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; box-shadow: none; padding: 5px 12px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .banner { margin-top: 12px; padding: 10px 12px; border-radius: 6px; border: 1px solid; font-weight: 500; }
  .banner[hidden] { display: none; }
  .banner-error { color: var(--error); background: var(--error-bg); border-color: var(--error); }
  .banner-warn { color: var(--warning); background: var(--warning-bg); border-color: var(--warning); }
  .banner-ok { color: var(--success); background: var(--success-bg); border-color: var(--success); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; margin-top: 16px; align-items: start; }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
  @media (max-width: 420px) { .wrap { padding: 10px; } header { align-items: flex-start; flex-direction: column; } }
  .panel { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); overflow: hidden; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--bg); flex-wrap: wrap; }
  .panel-body { padding: 12px; max-height: 68vh; overflow: auto; }
  .field { display: flex; align-items: center; gap: 6px; }
  .field input, .field select { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; max-width: 220px; }
  .msg { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); margin-bottom: 8px; }
  .msg.highlight { background: var(--highlight); border-color: var(--warning); }
  .msg-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 2px; }
  .who { font-weight: 650; }
  .when { color: var(--muted); font-size: 12px; }
  .msg-text { overflow-wrap: anywhere; }
  .empty { color: var(--muted); padding: 20px 4px; text-align: center; }
  .report-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--bg); flex-wrap: wrap; }
  .report-body { padding: 12px; max-height: 68vh; overflow: auto; }
  .summary { color: var(--muted); margin: 0 0 12px; }
  .group { margin-bottom: 16px; }
  .item { border: 1px solid var(--border); border-radius: 6px; background: var(--bg); padding: 8px 10px; margin-bottom: 6px; }
  .item.flagged { border-color: var(--warning); background: var(--warning-bg); }
  .item.done .desc { text-decoration: line-through; color: var(--done); }
  .item-top { display: flex; gap: 8px; align-items: flex-start; }
  .item-top input[type="checkbox"] { margin-top: 3px; }
  .item-main { flex: 1; min-width: 0; }
  .desc { overflow-wrap: anywhere; }
  .meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .conf { display: inline-flex; align-items: center; gap: 5px; }
  .bar { width: 42px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .actions { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .actions button { padding: 2px 7px; font-size: 12px; box-shadow: none; }
  .linkish { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 12px; }
  .skeleton { height: 12px; border-radius: 3px; margin-bottom: 8px; background: linear-gradient(90deg, var(--border) 25%, var(--panel) 50%, var(--border) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  .skeleton.block { height: 54px; }
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; background: var(--border); } html { scroll-behavior: auto; } }
  .status { margin-bottom: 10px; }
  .status:empty { display: none; }
  .status div { padding: 8px 10px; border-radius: 6px; border: 1px solid; }
  .status .err { color: var(--error); background: var(--error-bg); border-color: var(--error); }
  .status .ok { color: var(--success); background: var(--success-bg); border-color: var(--success); }
  .status .warn { color: var(--warning); background: var(--warning-bg); border-color: var(--warning); }
  .share { border-top: 1px solid var(--border); padding: 10px 12px; background: var(--bg); }
  .share-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .share-row + .share-row { margin-top: 8px; }
  footer { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
  dialog { border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); max-width: 720px; width: calc(100% - 32px); padding: 0; }
  dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  .dialog-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  dialog textarea { width: 100%; height: 320px; border: 0; border-radius: 0 0 8px 8px; padding: 12px; background: var(--panel); color: var(--fg); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; resize: vertical; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Auto-Reporter</h1>
    <div class="controls">
      <div class="seg" role="group" aria-label="Report period">
        <button type="button" data-type="daily" aria-pressed="true">Daily</button>
        <button type="button" data-type="weekly" aria-pressed="false">Weekly</button>
      </div>
      <button type="button" id="theme">Toggle theme</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="grid">
    <section class="panel" aria-labelledby="thread-title">
      <div class="panel-head">
        <h2 id="thread-title">Slack thread</h2>
        <div class="field">
          <label class="sr-only" for="search">Search messages</label>
          <input id="search" type="search" placeholder="Search messages" autocomplete="off">
        </div>
      </div>
      <div class="panel-body">
        <div class="field" style="margin-bottom:10px">
          <label class="sr-only" for="sample">Sample thread</label>
          <select id="sample">
            <option value="launch">Launch week</option>
            <option value="support">Support rotation</option>
            <option value="long">Long thread (220 messages)</option>
          </select>
          <span id="thread-count" class="when"></span>
        </div>
        <div id="messages"></div>
      </div>
    </section>

    <section class="panel" aria-labelledby="report-title">
      <div class="report-head">
        <h2 id="report-title" tabindex="-1">Status report</h2>
        <button type="button" class="primary" id="generate">Generate report</button>
      </div>
      <div class="report-body">
        <div id="status" class="status" aria-live="polite"></div>
        <div id="report"></div>
      </div>
      <div class="share">
        <div class="share-row">
          <span class="when">Export</span>
          <button type="button" data-export="markdown" disabled>Markdown</button>
          <button type="button" data-export="slack" disabled>Slack message</button>
          <button type="button" data-export="email" disabled>Email</button>
        </div>
        <div class="share-row">
          <label class="sr-only" for="channel">Slack channel id</label>
          <input id="channel" placeholder="Channel id (C…)" autocomplete="off">
          <button type="button" id="send" disabled>Send to channel</button>
          <a class="linkish" href="/api/v1/auth/slack/install">Connect a workspace</a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <span id="provider">AI provider: loading…</span>
    <span>Reports are stored in the local database. Nothing is sent anywhere unless you choose Send.</span>
  </footer>
</div>

<dialog id="export-dialog" aria-labelledby="export-title">
  <div class="dialog-head">
    <h2 id="export-title">Export</h2>
    <div class="controls">
      <button type="button" id="copy">Copy</button>
      <button type="button" id="download">Download</button>
      <button type="button" id="close-dialog">Close</button>
    </div>
  </div>
  <textarea id="export-text" readonly aria-label="Exported report"></textarea>
</dialog>

<script>
(function () {
  "use strict";

  var state = {
    sample: "launch",
    type: "daily",
    report: null,
    offline: false,
    provider: null,
    filter: "",
    editingId: null,
    exportFormat: "markdown"
  };

  var SAMPLES = {
    launch: [
      { user: "alice", text: "Launch check: we're blocked on the staging TLS cert until it is renewed." },
      { user: "sam", text: "Sam will renew it this morning." },
      { user: "alice", text: "The staging deploy is not blocked anymore, the cert was rotated." },
      { user: "priya", text: "Checkout is throwing 500 errors for about 10% of users." },
      { user: "dana", text: "I'll take the checkout errors after standup." },
      { user: "marcus", text: "We decided to delay the public launch to Tuesday." },
      { user: "priya", text: "Bob said: \"the API is blocked\" but that was last week." },
      { user: "alice", text: "Could we add a CSV export to the dashboard? Would be nice for finance." },
      { user: "sam", text: "Action item: update the runbook - assigned to Marcus." },
      { user: "marcus", text: "Will do. Also, the payments integration is unblocked now that the sandbox is live." },
      { user: "dana", text: "Great, the build is red again." },
      { user: "alice", text: "Agreed: we're going with Postgres for the new service." }
    ],
    support: [
      { user: "erin", text: "We are waiting on the security review before we can ship the SSO fix." },
      { user: "frank", text: "Frank will chase the review today." },
      { user: "erin", text: "We don't need support for SAML in this milestone." },
      { user: "grace", text: "Memory leak in the ingest worker, reproduced on staging." },
      { user: "heidi", text: "I'll profile it this afternoon." },
      { user: "frank", text: "The auth crash is fixed and deployed to staging." },
      { user: "grace", text: "We agreed to move the weekly report to Mondays." },
      { user: "erin", text: "No need to update the docs for the hotfix." },
      { user: "heidi", text: "Can someone review PR #482? @priya please take a look." },
      { user: "ivan", text: "The vendor hasn't sent the contract yet, so we can't start the migration." },
      { user: "grace", text: "We shipped 500 units last quarter, for what it's worth." },
      { user: "frank", text: "We will not ship on Friday; the team agreed to move to Monday." }
    ],
    long: []
  };

  (function buildLongThread() {
    var people = ["alice", "sam", "priya", "dana", "marcus"];
    var base = 1700000000;
    for (var i = 0; i < 220; i += 1) {
      var text = "Status update " + (i + 1) + ": deploy checks are running normally.";
      if (i % 37 === 5) text = "We are blocked on the API key rotation for staging.";
      if (i % 41 === 7) text = "Priya will rotate the keys after standup.";
      if (i % 53 === 11) text = "We decided to keep the older SDK until Q1.";
      if (i % 61 === 13) text = "Checkout is throwing 500 errors for a small group of users.";
      if (i % 71 === 17) text = "Could we add a CSV export to the dashboard?";
      if (i % 29 === 3) text = "The staging deploy is not blocked anymore.";
      SAMPLES.long.push({ user: people[i % people.length], text: text, ts: String(base + i * 60) });
    }
  }());

  var $ = function (id) { return document.getElementById(id); };
  var messagesEl = $("messages");
  var reportEl = $("report");
  var statusEl = $("status");
  var bannerEl = $("banner");
  var providerEl = $("provider");
  var exportDialog = $("export-dialog");

  function currentMessages() {
    return SAMPLES[state.sample] || [];
  }

  function setStatus(message, kind) {
    statusEl.innerHTML = "";
    if (!message) return;
    var div = document.createElement("div");
    div.className = kind || "";
    div.textContent = message;
    statusEl.appendChild(div);
  }

  function setBanner(message, kind) {
    if (!message) {
      bannerEl.hidden = true;
      bannerEl.textContent = "";
      bannerEl.className = "banner";
      return;
    }
    bannerEl.hidden = false;
    bannerEl.className = "banner " + (kind || "banner-warn");
    bannerEl.textContent = message;
  }

  function formatTime(ts) {
    if (!ts) return "";
    var value = parseFloat(ts);
    if (!isFinite(value)) return "";
    return new Date(value * 1000).toLocaleString();
  }

  function renderMessages() {
    var query = state.filter.trim().toLowerCase();
    var all = currentMessages();
    var visible = all
      .map(function (message, index) { return { message: message, index: index }; })
      .filter(function (entry) { return !query || entry.message.text.toLowerCase().indexOf(query) !== -1; });

    messagesEl.innerHTML = "";
    $("thread-count").textContent = query
      ? visible.length + " of " + all.length + " messages"
      : all.length + " messages";

    if (!visible.length) {
      var empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "No messages match that search.";
      messagesEl.appendChild(empty);
      return;
    }

    visible.forEach(function (entry) {
      var wrapper = document.createElement("article");
      wrapper.className = "msg";
      wrapper.id = "msg-" + entry.index;

      var head = document.createElement("div");
      head.className = "msg-head";
      var who = document.createElement("span");
      who.className = "who";
      who.textContent = "@" + (entry.message.user || "unknown");
      var when = document.createElement("span");
      when.className = "when";
      when.textContent = formatTime(entry.message.ts);
      head.appendChild(who);
      head.appendChild(when);

      var text = document.createElement("div");
      text.className = "msg-text";
      text.textContent = entry.message.text;

      wrapper.appendChild(head);
      wrapper.appendChild(text);
      messagesEl.appendChild(wrapper);
    });
  }

  function jumpToMessage(index) {
    var target = document.getElementById("msg-" + index);
    if (!target) {
      var message = currentMessages()[index];
      if (message && state.filter) {
        state.filter = "";
        $("search").value = "";
        renderMessages();
        target = document.getElementById("msg-" + index);
      }
    }
    if (!target) return;
    target.scrollIntoView({ behavior: "smooth", block: "center" });
    target.classList.add("highlight");
    window.setTimeout(function () { target.classList.remove("highlight"); }, 2200);
  }

  function confidenceLabel(value) {
    if (typeof value !== "number" || !isFinite(value)) return null;
    var pct = Math.round(Math.max(0, Math.min(1, value)) * 100);
    var kind = state.report && state.report.mode === "ai" ? "model-reported" : "cue strength, not probability";
    var wrap = document.createElement("span");
    wrap.className = "conf";
    wrap.title = pct + "% confidence (" + kind + ")";
    wrap.setAttribute("aria-label", wrap.title);
    var bar = document.createElement("span");
    bar.className = "bar";
    var fill = document.createElement("span");
    fill.style.width = pct + "%";
    bar.appendChild(fill);
    wrap.appendChild(bar);
    wrap.appendChild(document.createTextNode(pct + "%"));
    return wrap;
  }

  function categoryTitle(category) {
    return {
      blocker: "Blockers",
      action_item: "Action items",
      decision: "Decisions",
      bug: "Bugs",
      feature_request: "Feature requests"
    }[category] || category;
  }

  function sourceIndex(item) {
    var refs = item.source_references || [];
    if (!refs.length) return null;
    var index = refs[0].msg_index;
    return typeof index === "number" ? index : null;
  }

  function itemRow(item) {
    var row = document.createElement("div");
    row.className = "item" + (item.done ? " done" : "") + (item.status === "flagged" ? " flagged" : "");
    row.dataset.id = String(item.id);

    var top = document.createElement("div");
    top.className = "item-top";

    var checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = Boolean(item.done);
    checkbox.setAttribute("aria-label", "Mark done: " + item.description);
    checkbox.addEventListener("change", function () { toggleDone(item, checkbox.checked); });
    top.appendChild(checkbox);

    var main = document.createElement("div");
    main.className = "item-main";

    if (state.editingId === item.id) {
      var textarea = document.createElement("textarea");
      textarea.value = item.description;
      textarea.rows = 3;
      textarea.style.width = "100%";
      textarea.setAttribute("aria-label", "Edit item text");
      main.appendChild(textarea);
      var editActions = document.createElement("div");
      editActions.className = "actions";
      var save = document.createElement("button");
      save.type = "button";
      save.textContent = "Save";
      save.addEventListener("click", function () { saveEdit(item, textarea.value); });
      var cancel = document.createElement("button");
      cancel.type = "button";
      cancel.textContent = "Cancel";
      cancel.addEventListener("click", function () { state.editingId = null; renderReport(); });
      editActions.appendChild(save);
      editActions.appendChild(cancel);
      main.appendChild(editActions);
    } else {
      var desc = document.createElement("div");
      desc.className = "desc";
      desc.textContent = item.description;
      main.appendChild(desc);

      var meta = document.createElement("div");
      meta.className = "meta";
      if (item.assignee) {
        var owner = document.createElement("span");
        owner.textContent = "Owner: @" + item.assignee;
        meta.appendChild(owner);
      }
      var confidence = confidenceLabel(item.confidence);
      if (confidence) meta.appendChild(confidence);
      var index = sourceIndex(item);
      if (index !== null) {
        var source = document.createElement("button");
        source.type = "button";
        source.className = "linkish";
        source.textContent = "Source #" + (index + 1);
        source.addEventListener("click", function () { jumpToMessage(index); });
        meta.appendChild(source);
      }
      if (item.status === "flagged") {
        var flagged = document.createElement("span");
        flagged.textContent = "Reported as wrong";
        meta.appendChild(flagged);
      }
      main.appendChild(meta);

      var actions = document.createElement("div");
      actions.className = "actions";

      var edit = document.createElement("button");
      edit.type = "button";
      edit.textContent = "Edit";
      edit.addEventListener("click", function () { state.editingId = item.id; renderReport(); });
      actions.appendChild(edit);

      var up = document.createElement("button");
      up.type = "button";
      up.textContent = "Move up";
      up.addEventListener("click", function () { moveItem(item, -1); });
      actions.appendChild(up);

      var down = document.createElement("button");
      down.type = "button";
      down.textContent = "Move down";
      down.addEventListener("click", function () { moveItem(item, 1); });
      actions.appendChild(down);

      var wrong = document.createElement("button");
      wrong.type = "button";
      wrong.textContent = item.status === "flagged" ? "Correction saved" : "Wrong?";
      wrong.disabled = item.status === "flagged";
      wrong.addEventListener("click", function () { reportWrong(item); });
      actions.appendChild(wrong);

      var remove = document.createElement("button");
      remove.type = "button";
      remove.textContent = "Delete";
      remove.addEventListener("click", function () { deleteItem(item); });
      actions.appendChild(remove);

      main.appendChild(actions);
    }

    top.appendChild(main);
    row.appendChild(top);
    return row;
  }

  function renderReport() {
    reportEl.innerHTML = "";

    if (!state.report) {
      var empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "No report yet. Pick a thread and generate one.";
      reportEl.appendChild(empty);
      setShareEnabled(false);
      return;
    }

    var report = state.report;
    var summary = document.createElement("p");
    summary.className = "summary";
    summary.textContent = report.report.executive_summary || "";
    reportEl.appendChild(summary);

    var modeNote = document.createElement("p");
    modeNote.className = "summary";
    var provider = report.report.ai_provider || (state.offline ? "offline demo" : "rules");
    var model = report.report.ai_model ? " (" + report.report.ai_model + ")" : "";
    modeNote.textContent = report.mode === "ai"
      ? "Generated by " + provider + model + " - confidence is model-reported, not a calibrated probability."
      : "Generated by deterministic rules - no model was called. Confidence reflects cue strength, not probability.";
    reportEl.appendChild(modeNote);

    var groups = ["blocker", "action_item", "decision", "bug", "feature_request"];
    var items = report.items || [];
    var any = false;

    groups.forEach(function (category) {
      var groupItems = items.filter(function (item) { return item.category === category; });
      if (!groupItems.length) return;
      any = true;
      var group = document.createElement("section");
      group.className = "group";
      var heading = document.createElement("h3");
      heading.textContent = categoryTitle(category) + " (" + groupItems.length + ")";
      group.appendChild(heading);
      groupItems.forEach(function (item) { group.appendChild(itemRow(item)); });
      reportEl.appendChild(group);
    });

    if (!any) {
      var none = document.createElement("p");
      none.className = "empty";
      none.textContent = "No blockers, action items or decisions were found in this thread.";
      reportEl.appendChild(none);
    }

    setShareEnabled(true);
  }

  function setShareEnabled(enabled) {
    document.querySelectorAll("[data-export]").forEach(function (button) {
      button.disabled = !enabled || !state.report;
    });
    $("send").disabled = !enabled || !state.report || state.offline || !state.report.report_id;
  }

  function reportId() {
    return state.report && state.report.report_id;
  }

  function patchItem(item, changes) {
    var id = reportId();
    if (!id || state.offline) return Promise.resolve(false);
    return fetch("/api/v1/reports/" + id + "/items/" + item.id, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(changes)
    }).then(function (response) {
      if (!response.ok) throw new Error("Could not save the change.");
      return response.json().then(function (data) {
        if (data.item) Object.assign(item, data.item);
        return true;
      });
    }).catch(function (error) {
      setStatus(error.message + " The change is only local until the backend is reachable.", "err");
      return false;
    });
  }

  function toggleDone(item, done) {
    item.done = done;
    renderReport();
    patchItem(item, { done: done });
  }

  function saveEdit(item, value) {
    var text = value.trim();
    if (!text) {
      setStatus("Item text cannot be empty.", "err");
      return;
    }
    item.description = text;
    state.editingId = null;
    renderReport();
    patchItem(item, { description: text });
  }

  function moveItem(item, direction) {
    var items = state.report.items;
    var index = items.indexOf(item);
    var target = index + direction;
    if (index < 0 || target < 0 || target >= items.length) return;
    items.splice(index, 1);
    items.splice(target, 0, item);
    renderReport();
    if (state.offline || !reportId()) return;
    Promise.all(items.map(function (entry, position) {
      return patchItem(entry, { position: position });
    })).then(function () {
      setStatus("Order saved.", "ok");
    });
  }

  function deleteItem(item) {
    if (state.editingId === item.id) state.editingId = null;
    var index = state.report.items.indexOf(item);
    if (index >= 0) state.report.items.splice(index, 1);
    renderReport();
    var id = reportId();
    if (!id || state.offline) return;
    fetch("/api/v1/reports/" + id + "/items/" + item.id, { method: "DELETE" })
      .then(function (response) {
        if (!response.ok) throw new Error("Could not delete the item.");
        setStatus("Item deleted.", "ok");
      })
      .catch(function (error) { setStatus(error.message, "err"); });
  }

  function reportWrong(item) {
    var id = reportId();
    if (!id || state.offline) {
      setStatus("Corrections need the backend so they can be stored as evaluation data.", "warn");
      return;
    }
    fetch("/api/v1/reports/" + id + "/items/" + item.id + "/correction", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ verdict: "wrong" })
    }).then(function (response) {
      if (!response.ok) throw new Error("Could not record the correction.");
      item.status = "flagged";
      renderReport();
      setStatus("Correction saved. It is stored with the report and can be used as evaluation data.", "ok");
    }).catch(function (error) { setStatus(error.message, "err"); });
  }

  function renderSkeleton() {
    reportEl.innerHTML = "";
    for (var i = 0; i < 3; i += 1) {
      var block = document.createElement("div");
      block.className = "skeleton block";
      reportEl.appendChild(block);
    }
  }

  function generate() {
    var messages = currentMessages().map(function (message) {
      return { user: message.user, text: message.text, ts: message.ts || null };
    });
    if (!messages.length) {
      setStatus("This thread has no messages.", "warn");
      return;
    }

    $("generate").disabled = true;
    setStatus("Generating report…", "");
    renderSkeleton();
    setBanner("", null);

    fetch("/api/v1/demo/report", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: messages,
        report_type: state.type,
        title: $("sample").selectedOptions[0].textContent + " - " + state.type
      })
    }).then(function (response) {
      if (!response.ok) {
        return response.json().catch(function () { return {}; }).then(function (body) {
          throw new Error(body.detail || "The backend returned " + response.status + ".");
        });
      }
      return response.json();
    }).then(function (data) {
      state.report = data;
      state.offline = false;
      state.editingId = null;
      renderReport();
      if (data.warning) {
        setStatus(data.warning, "warn");
      } else if (data.mode === "rules") {
        setStatus("Rule-based report. Configure AI_PROVIDER and AI_API_KEY for model output.", "warn");
      } else {
        setStatus("Report generated with " + data.provider.provider + ".", "ok");
      }
      $("report-title").focus();
      refreshBanner();
    }).catch(function (error) {
      state.report = offlineReport(messages);
      state.offline = true;
      state.editingId = null;
      renderReport();
      setStatus("Backend unavailable: " + error.message + " Start the API with uvicorn app.main:app and reload, or keep using this offline demo.", "err");
      refreshBanner();
    }).finally(function () {
      $("generate").disabled = false;
    });
  }

  function refreshBanner() {
    if (state.offline) {
      setBanner("Offline demo - the backend is unreachable. This report was generated in your browser and is not saved. Nothing is sent anywhere.", "banner-error");
      return;
    }
    if (state.report && state.report.mode === "rules") {
      setBanner("Rule-based output - no AI model was used for this report. Every item comes from explicit cue words and is labelled with a confidence score (cue strength, not probability).", "banner-warn");
      return;
    }
    if (state.report && state.report.mode === "ai") {
      setBanner("AI-generated report. Confidence scores are model-reported, not calibrated probabilities; check the score and source on each item before sharing.", "banner-ok");
      return;
    }
    if (state.provider && !state.provider.live) {
      setBanner("AI provider: " + state.provider.provider + " - " + state.provider.note, "banner-warn");
      return;
    }
    setBanner("", null);
  }

  function offlineReport(messages) {
    var items = [];
    var seen = {};
    messages.forEach(function (message, index) {
      var text = message.text;
      var lowered = text.toLowerCase();
      var category = null;
      if (/blocked|blocker|waiting on|waiting for/.test(lowered) && !/not blocked|no longer|anymore|unblocked/.test(lowered)) {
        category = "blocker";
      } else if (/bug|crash|error|500|regression/.test(lowered) && !/fixed|resolved/.test(lowered)) {
        category = "bug";
      } else if (/decided|decision|agreed|going with/.test(lowered)) {
        category = "decision";
      } else if (/action item|need to|will |i'll|please/.test(lowered)) {
        category = "action_item";
      } else if (/feature request|could we add|would be nice/.test(lowered)) {
        category = "feature_request";
      }
      if (!category) return;
      var key = index + ":" + category;
      if (seen[key]) return;
      seen[key] = true;
      items.push({
        id: "local-" + key,
        category: category,
        description: text,
        assignee: null,
        confidence: 0.5,
        done: false,
        status: null,
        source_references: [{ msg_index: index }]
      });
    });
    var counts = {};
    items.forEach(function (item) { counts[item.category] = (counts[item.category] || 0) + 1; });
    return {
      report_id: null,
      mode: "offline",
      items: items,
      report: {
        title: "Offline demo",
        executive_summary: messages.length + " messages analysed locally: " + items.length + " items. This is a browser-only fallback.",
        ai_provider: "offline rules",
        ai_model: null
      }
    };
  }

  function loadProvider() {
    fetch("/api/v1/ai/status").then(function (response) {
      if (!response.ok) throw new Error("status " + response.status);
      return response.json();
    }).then(function (data) {
      state.provider = data;
      var label = data.provider;
      if (data.model) label += " · " + data.model;
      label += data.live ? " (live)" : " (no model calls)";
      providerEl.textContent = "AI provider: " + label + " — " + data.note;
      refreshBanner();
    }).catch(function () {
      providerEl.textContent = "AI provider: unknown (backend unreachable)";
    });
  }

  function openExport(format) {
    var id = reportId();
    if (!id) return;
    fetch("/api/v1/reports/" + id + "/export?format=" + encodeURIComponent(format))
      .then(function (response) {
        if (!response.ok) throw new Error("Export failed.");
        return response.json();
      })
      .then(function (data) {
        state.exportFormat = format;
        $("export-title").textContent = "Export - " + format;
        $("export-text").value = data.content;
        if (typeof exportDialog.showModal === "function") {
          exportDialog.showModal();
        } else {
          exportDialog.setAttribute("open", "");
        }
        $("export-text").focus();
      })
      .catch(function (error) { setStatus(error.message, "err"); });
  }

  function copyExport() {
    var textarea = $("export-text");
    textarea.select();
    var done = function () { $("copy").textContent = "Copied"; window.setTimeout(function () { $("copy").textContent = "Copy"; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(textarea.value).then(done).catch(function () { document.execCommand("copy"); done(); });
    } else {
      document.execCommand("copy");
      done();
    }
  }

  function downloadExport() {
    var textarea = $("export-text");
    var extension = state.exportFormat === "markdown" ? "md" : "txt";
    var blob = new Blob([textarea.value], { type: "text/plain;charset=utf-8" });
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "report." + extension;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
  }

  function sendToSlack() {
    var id = reportId();
    var channel = $("channel").value.trim();
    if (!id) return;
    $("send").disabled = true;
    setStatus("Sending to Slack…", "");
    fetch("/api/v1/slack/post", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ report_id: id, channel: channel || null })
    }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (body) {
        if (!response.ok) throw new Error(body.detail || "Slack rejected the message.");
        return body;
      });
    }).then(function () {
      setStatus("Sent to Slack.", "ok");
    }).catch(function (error) {
      setStatus(error.message + " Connect a workspace or set SLACK_BOT_TOKEN, then try again.", "err");
    }).finally(function () {
      $("send").disabled = false;
    });
  }

  document.querySelectorAll("[data-type]").forEach(function (button) {
    button.addEventListener("click", function () {
      state.type = button.dataset.type;
      document.querySelectorAll("[data-type]").forEach(function (other) {
        other.setAttribute("aria-pressed", String(other === button));
      });
    });
  });

  $("theme").addEventListener("click", function () {
    var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (error) { /* private mode */ }
  });

  $("sample").addEventListener("change", function (event) {
    state.sample = event.target.value;
    renderMessages();
  });

  $("search").addEventListener("input", function (event) {
    state.filter = event.target.value;
    renderMessages();
  });

  $("generate").addEventListener("click", generate);
  $("send").addEventListener("click", sendToSlack);
  document.querySelectorAll("[data-export]").forEach(function (button) {
    button.addEventListener("click", function () { openExport(button.dataset.export); });
  });
  $("copy").addEventListener("click", copyExport);
  $("download").addEventListener("click", downloadExport);
  $("close-dialog").addEventListener("click", function () { exportDialog.close(); });
  exportDialog.addEventListener("keydown", function (event) {
    if (event.key === "Escape") exportDialog.close();
  });

  var savedTheme = "light";
  try { savedTheme = localStorage.getItem("theme") || "light"; } catch (error) { /* ignore */ }
  document.documentElement.dataset.theme = savedTheme;

  renderMessages();
  renderReport();
  loadProvider();
}());
</script>
</body>
</html>
